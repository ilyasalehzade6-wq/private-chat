<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چت — پیام‌رسان خصوصی</title>
<link rel="manifest" href="./manifest.json">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="chat-app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">💬</div>
      <div class="info">
        <h3 id="myName">...</h3>
        <p id="myStatus">آنلاین</p>
      </div>
      <button class="icon-btn" id="profileBtn" title="پروفایل">👤</button>
      <button class="icon-btn" id="themeBtn" title="تغییر تم">🌙</button>
      <button class="icon-btn" id="logoutBtn" title="خروج">🚪</button>
    </div>
    <div class="rubika-tabs">
      <button class="active" data-tab="all">همه</button>
      <button data-tab="unread">خوانده‌نشده</button>
      <button data-tab="online">آنلاین</button>
    </div>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="جستجوی کاربر...">
    </div>
    <div class="user-list" id="userList">
      <div style="text-align:center;padding:30px;color:var(--muted);font-size:13px">
        در حال بارگذاری کاربران...
      </div>
    </div>
  </aside>

  <main class="chat-area">
    <div class="chat-header" id="chatHeader" style="display:none">
      <button class="icon-btn back-btn" id="backBtn">←</button>
      <div class="avatar" id="chatAvatar"></div>
      <div class="info">
        <h3 id="chatName"></h3>
        <p id="chatStatus"></p>
      </div>
      <button class="icon-btn" id="searchToggle" title="جستجو">🔍</button>
      <button class="icon-btn" id="pinToggle" title="پیام‌های پین‌شده">📌</button>
    </div>

    <div class="chat-search-bar" id="chatSearchBar" style="display:none">
      <input type="text" id="chatSearchInput" placeholder="جستجو در پیام‌ها...">
      <span class="search-count" id="searchCount"></span>
      <button class="icon-btn-sm" id="chatSearchClose">✕</button>
    </div>

    <div class="pinned-banner" id="pinnedBanner" style="display:none">
      <div class="pin-icon">📌</div>
      <div class="pin-body">
        <div class="pin-label">پیام پین‌شده</div>
        <div class="pin-text" id="pinnedText"></div>
      </div>
      <button class="pin-close" id="pinClose">✕</button>
    </div>

    <div class="messages-area" id="messagesArea">
      <div class="empty-chat">
        <div class="big-icon">💬</div>
        <p>یک کاربر را از لیست انتخاب کن تا چت شروع شود</p>
      </div>
    </div>

    <div class="typing-indicator" id="typingIndicator"></div>

    <div class="reply-preview" id="replyPreview" style="display:none">
      <div class="reply-inner">
        <div class="reply-label">↩ پاسخ به <span id="replyName"></span></div>
        <div class="reply-text" id="replyText"></div>
      </div>
      <button class="reply-close" id="replyClose">✕</button>
    </div>

    <div class="edit-banner" id="editBanner" style="display:none">
      <div class="edit-inner">
        <div class="edit-label">✏️ ویرایش پیام</div>
        <div class="edit-text" id="editText"></div>
      </div>
      <button class="edit-close" id="editClose">✕</button>
    </div>

    <div class="attachment-preview" id="attachmentPreview" style="display:none">
      <div class="attachment-preview-inner">
        <div id="attachPreviewContent"></div>
        <div class="attachment-info" id="attachInfo"></div>
      </div>
      <button class="attach-remove" id="attachRemove" title="حذف ضمیمه">✕</button>
    </div>

    <div class="composer" id="composer" style="display:none">
      <input type="file" id="fileInput" style="display:none" accept="image/*,video/*,.pdf,.doc,.docx,.zip,.rar,.txt">
      <button class="attach-btn" id="attachBtn" type="button" title="پیوست فایل">📎</button>
      <textarea id="messageInput" placeholder="پیامت را بنویس..." rows="1"></textarea>
      <button class="send-btn" id="sendBtn" disabled>📤</button>
    </div>
  </main>
</div>

<div class="modal-bg" id="profileModal">
  <div class="modal">
    <div class="modal-head">
      <h3>👤 ویرایش پروفایل</h3>
      <button id="profileClose">✕</button>
    </div>
    <div class="modal-body">
      <div class="profile-avatar-edit">
        <div class="avatar-preview-lg" id="avatarPreviewLg">👤</div>
        <label class="btn-upload-avatar" for="avatarInput">
          <input type="file" id="avatarInput" accept="image/*">
          📷 تغییر عکس
        </label>
      </div>
      <div class="form-group" style="margin-top:18px">
        <label>نام نمایشی</label>
        <input type="text" id="profileDisplayName" placeholder="نام کامل شما">
      </div>
      <div class="form-group">
        <label>نام کاربری</label>
        <input type="text" id="profileUsername" placeholder="username" disabled>
      </div>
      <div class="modal-actions">
        <button class="btn-secondary" id="profileCancelBtn">لغو</button>
        <button class="btn-primary" id="profileSaveBtn">ذخیره تغییرات</button>
      </div>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<button class="fab-new-chat" id="fabNewChat" title="چت جدید">✏️</button>

<nav class="mobile-tabbar" id="mobileTabbar">
  <button data-tab="chats" class="active">
    <span class="icon">💬</span>
    <span class="label">چت‌ها</span>
  </button>
  <button data-tab="contacts">
    <span class="icon">👥</span>
    <span class="label">مخاطبین</span>
  </button>
  <button data-tab="profile">
    <span class="icon">👤</span>
    <span class="label">من</span>
  </button>
</nav>

<div class="toast" id="toast"></div>
<script type="module" src="./js/chat.js">// ثبت Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
